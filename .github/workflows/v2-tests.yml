name: V2 slicer regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/v2-tests.yml
      - name: Install geometry and testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "scipy>=1.11" "shapely>=2.0,<3" "trimesh>=4.0" "rtree>=1.2" "mapbox-earcut>=1.0" "pytest>=8"
      - name: Verify exact-radius tube and recovery guards
        run: |
          python -m unittest cyl_slicer_v2.tests.test_stage3_intersection_backend.IntersectionBackendTests.test_tube_intersection_layer_is_nonempty_and_full_wrap
          python -m unittest cyl_slicer_v2.tests.test_intersection_recovery_guard
      - name: Verify anchored bridge geometry and opt-in output
        run: |
          python -m unittest cyl_slicer_v2.tests.test_bridge_classification
          python -m unittest cyl_slicer_v2.tests.test_bridge_output
      - name: Verify variable-width narrow-gap geometry and extrusion
        run: python -m unittest cyl_slicer_v2.tests.test_gap_fill_variable_width
      - name: Run full v2 unittest suite
        run: python -m unittest discover cyl_slicer_v2/tests
